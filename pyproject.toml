[project]
name = "trmnl-it8951-bridge"
version = "0.1.0"
description = "Show TRMNL HA add-on dashboards on a Waveshare IT8951 e-paper panel (push and pull, partial updates)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings[yaml]>=2.6",
    "pillow>=11.0",
    "numpy>=2.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Only needed on the Raspberry Pi (installed in the container image).
hw = [
    "spidev>=3.6",
    "gpiod>=2.2",
]

[project.scripts]
trmnl-it8951-bridge = "trmnl_it8951_bridge.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trmnl_it8951_bridge"]

# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "RET", "BLE", "ASYNC", "S", "PL"]
ignore = [
    "PLR0913",  # driver functions mirror the IT8951 command arguments
    "PLR2004",  # magic values are protocol constants
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR0917",
    "PLC0415",  # hardware modules (spidev, gpiod) are imported lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"tools/**" = ["S101", "T201", "PLW0603", "S311", "PT018", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["spidev", "gpiod", "gpiod.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["trmnl_it8951_bridge"]
omit = ["*/driver/transport.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
